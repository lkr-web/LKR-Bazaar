<style>
:root{--blue:#0b63ce;--blue2:#084caa;--orange:#ff8a00;--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#687386;--line:#e7ebf1;--danger:#e53935;--green:#159447;--shadow:0 6px 22px rgba(20,42,75,.08);--radius:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100vh}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
#app{min-height:100vh}.shell{max-width:720px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue),#1680ee);padding:12px 14px;color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.13)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;font-size:21px;letter-spacing:.2px}.brand small{display:block;font-size:10px;font-weight:600;opacity:.8}
.searchrow{display:flex;gap:9px;margin-top:11px}.search{flex:1;display:flex;align-items:center;background:#fff;border-radius:12px;padding:0 12px;color:#7a8494}.search input{width:100%;border:0;outline:0;padding:12px 8px;background:transparent;color:var(--text)}
.iconbtn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;position:relative;font-size:20px}.badge{position:absolute;right:-3px;top:-4px;background:var(--orange);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;padding:2px 4px;font-weight:800}
main{padding:14px}.section{margin:0 0 22px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section h2{font-size:18px;margin:0}.link{color:var(--blue);font-size:13px;font-weight:800;background:none}
.hero{background:linear-gradient(120deg,#eaf4ff,#fff3e3);border-radius:20px;padding:18px;display:flex;justify-content:space-between;align-items:center;overflow:hidden}.hero h1{font-size:23px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:13px}.hero strong{color:var(--orange)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:750;color:#465164}.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 5px;text-align:center;box-shadow:var(--shadow)}.cat .ico{font-size:25px}.cat span{display:block;margin-top:5px;font-size:11px;font-weight:750}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}.pimg{height:170px;background:#eef2f6;position:relative;cursor:pointer}.pimg img{width:100%;height:100%;object-fit:cover;display:block}.wish{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);font-size:18px;box-shadow:0 2px 9px #0002}.wish.on{color:#e53935}.pbody{padding:10px}.pname{font-weight:800;font-size:14px;line-height:1.25;min-height:35px}.shopline{font-size:11px;color:var(--muted);margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:17px;font-weight:900}.old{text-decoration:line-through;color:#9aa3af;font-size:11px;margin-left:4px}.discount{color:var(--green);font-size:11px;font-weight:800;margin-left:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.btn{min-height:40px;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px}.primary{background:var(--blue);color:#fff}.orange{background:var(--orange);color:#fff}.secondary{background:#eef5ff;color:var(--blue)}.danger{background:#fff0f0;color:var(--danger)}.full{width:100%}
.list{display:grid;gap:10px}.shopcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);cursor:pointer}.shoplogo{width:58px;height:58px;flex:0 0 58px;border-radius:15px;background:linear-gradient(135deg,#e9f3ff,#fff1df);display:grid;place-items:center;font-size:27px}.shopinfo{min-width:0;flex:1}.shopinfo h3{margin:0 0 4px;font-size:15px}.shopinfo p{margin:3px 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-size:11px;color:var(--blue);font-weight:800}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--text);box-shadow:var(--shadow);font-size:20px}.pagehead h1{margin:0;font-size:20px}
.detailHero{background:#fff;border-radius:18px;border:1px solid var(--line);overflow:hidden}.detailMain{height:330px;background:#eef2f6;position:relative}.detailMain img{width:100%;height:100%;object-fit:contain;display:block}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px}.thumb{width:62px;height:62px;flex:0 0 62px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#f1f3f5}.thumb.active{border-color:var(--blue)}.thumb img{width:100%;height:100%;object-fit:cover}.detailbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:11px}.detailbox h1{font-size:21px;margin:0 0 7px}.desc{color:var(--muted);line-height:1.55;font-size:13px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.meta div{background:#f7f9fc;padding:10px;border-radius:11px;font-size:11px;color:var(--muted)}.meta strong{display:block;color:var(--text);font-size:13px;margin-top:2px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:36px;height:36px;border-radius:10px;background:#edf4ff;color:var(--blue);font-size:20px;font-weight:900}.qty strong{min-width:24px;text-align:center}.purchase{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.shophero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.shopheroTop{display:flex;gap:13px}.shophero .shoplogo{width:70px;height:70px;flex-basis:70px}.shophero h1{font-size:20px;margin:2px 0 4px}.shophero p{margin:5px 0;color:var(--muted);font-size:12px;line-height:1.4}
.cartitem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:10px}.cartimg{width:78px;height:78px;border-radius:12px;overflow:hidden;background:#eef2f6;flex:0 0 78px}.cartimg img{width:100%;height:100%;object-fit:cover}.cartbody{min-width:0;flex:1}.cartbody h3{font-size:14px;margin:1px 0 5px}.cartbottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:10px;margin:8px 0;font-size:13px}.grand{font-size:18px;font-weight:900;border-top:1px solid var(--line);padding-top:11px}
.profileHero{background:linear-gradient(135deg,var(--blue),#197ee8);color:#fff;border-radius:18px;padding:18px;display:flex;align-items:center;gap:13px}.avatar{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:25px;font-weight:900}.profileHero h2{margin:0;font-size:18px}.profileHero p{margin:4px 0 0;opacity:.85;font-size:12px}.menu{margin-top:12px;background:#fff;border-radius:17px;border:1px solid var(--line);overflow:hidden}.menuitem{width:100%;display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid var(--line);background:#fff;text-align:left}.menuitem:last-child{border-bottom:0}.menuico{width:34px;height:34px;border-radius:10px;background:#edf4ff;display:grid;place-items:center}.menuitem strong{font-size:13px}.menuitem small{display:block;color:var(--muted);margin-top:2px;font-size:10px}.menuitem .arrow{margin-left:auto;color:#98a2b3}
.form{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:#4e596a}.field input,.field textarea,.field select{width:100%;border:1px solid #dce2ea;border-radius:11px;padding:12px;outline:0;background:#fff}.field textarea{min-height:90px;resize:vertical}
.address{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.address + .address{margin-top:9px}.address.selected{border:2px solid var(--blue)}.address h3{margin:0 0 4px;font-size:14px}.address p{margin:4px 0;color:var(--muted);font-size:12px;line-height:1.45}
.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.order+.order{margin-top:10px}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf7ef;color:var(--green);font-size:10px;font-weight:900}.order h3{font-size:14px;margin:0}.order p{font-size:11px;color:var(--muted);margin:5px 0}.orderproducts{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.notice{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.notice+.notice{margin-top:9px}.notice strong{font-size:13px}.notice p{font-size:12px;color:var(--muted);margin:5px 0 0;line-height:1.45}
.empty{text-align:center;background:#fff;border:1px dashed #ccd4df;border-radius:17px;padding:35px 18px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:6px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px rgba(20,42,75,.08)}.nav{background:transparent;color:#7a8494;font-size:10px;font-weight:800;padding:4px 2px}.nav span{display:block;font-size:20px;line-height:22px}.nav.active{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#17202d;color:#fff;padding:11px 15px;border-radius:11px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#0006;z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:11px;background:#f1f3f6}
@media(min-width:600px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.catgrid{grid-template-columns:repeat(6,1fr)}.pimg{height:190px}}
</style>
</head>

<script>

{id:'p2',shop:'s1',name:'Sunflower Cooking Oil 1L',price:129,mrp:155,category:'Grocery',sub:'Cooking Essentials',stock:32,desc:'Light everyday cooking oil suitable for frying, sautéing and regular meals.',images:['https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=1000&q=85']},

{id:'p5',shop:'s2',name:'LED Study Desk Lamp',price:499,mrp:699,category:'Electronics',sub:'Home Electronics',stock:15,desc:'Adjustable LED desk lamp for study, reading and work from home.',images:['https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=1000&q=85']},
{id:'p6',shop:'s3',name:'Classic Cotton T-Shirt',price:299,mrp:449,category:'Fashion',sub:'Men',stock:20,desc:'Soft cotton everyday T-shirt with a comfortable regular fit.',images:['https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=1000&q=85']},
{id:'p7',shop:'s3',name:'Casual Running Sneakers',price:999,mrp:1499,category:'Fashion',sub:'Footwear',stock:9,desc:'Lightweight casual sneakers designed for everyday walking and active use.',images:['https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1000&q=85']},
{id:'p8',shop:'s4',name:'Non-Stick Fry Pan 24cm',price:649,mrp:899,category:'Kitchen',sub:'Cookware',stock:11,desc:'Practical non-stick fry pan for daily cooking with an easy-grip handle.',images:['https://images.unsplash.com/photo-1584990347449-ae7d4d9e0c4b?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1000&q=85']},
{id:'p9',shop:'s4',name:'Glass Spice Jar Set',price:179,mrp:249,category:'Kitchen',sub:'Storage',stock:16,desc:'Neat glass jars for storing spices and keeping your kitchen organised.',images:['https://images.unsplash.com/photo-1587049352846-4a222e784d38?auto=format&fit=crop&w=1000&q=85']},
{id:'p10',shop:'s5',name:'Aloe Face Wash 100ml',price:149,mrp:199,category:'Cosmetics',sub:'Face Care',stock:25,desc:'Gentle aloe-based face wash for a fresh daily cleansing routine.',images:['https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=1000&q=85']},
{id:'p11',shop:'s5',name:'Moisturising Body Lotion',price:219,mrp:299,category:'Cosmetics',sub:'Body Care',stock:18,desc:'Daily moisturising lotion with a smooth, non-greasy feel.',images:['https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=1000&q=85']},
{id:'p12',shop:'s6',name:'Stackable Storage Box 12L',price:159,mrp:219,category:'Home & Plastic',sub:'Storage',stock:22,desc:'Durable stackable storage box for clothes, toys and household items.',images:['https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=1000&q=85']},
{id:'p13',shop:'s6',name:'Laundry Basket Large',price:349,mrp:449,category:'Home & Plastic',sub:'Utility',stock:13,desc:'Large lightweight laundry basket with sturdy handles for home use.',images:['https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=1000&q=85']},
{id:'p14',shop:'s7',name:'Decorative Table Vase',price:279,mrp:399,category:'Decoration',sub:'Decor',stock:8,desc:'Minimal decorative vase for tables, shelves and home corners.',images:['https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?auto=format&fit=crop&w=1000&q=85']},
{id:'p15',shop:'s7',name:'Warm White String Lights',price:199,mrp:299,category:'Decoration',sub:'Lighting',stock:30,desc:'Warm decorative string lights for festive corners and room décor.',images:['https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=1000&q=85']},
{id:'p16',shop:'s5',name:'Matte Lip Color',price:99,mrp:149,category:'Cosmetics',sub:'Makeup',stock:19,desc:'Smooth matte lip color with an easy everyday finish.',images:['https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=1000&q=85']},
{id:'p17',shop:'s4',name:'Silicone Kitchen Spatula',price:79,mrp:99,category:'Kitchen',sub:'Tools',stock:40,desc:'Heat-resistant silicone spatula for everyday kitchen preparation.',images:['https://images.unsplash.com/photo-1556911220-bff31c812dba?auto=format&fit=crop&w=1000&q=85']},
{id:'p18',shop:'s6',name:'Plastic Water Bottle 1L',price:69,mrp:89,category:'Home & Plastic',sub:'Utility',stock:35,desc:'Reusable lightweight bottle for home, school and everyday carrying.',images:['https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=1000&q=85']}
];
const SHOPS=[
{id:'s1',name:'LKR Super Mart',icon:'🛒',category:'Grocery',address:'Main Market, Lakhisarai, Bihar',desc:'Everyday grocery and household essentials at practical local prices.'},
{id:'s2',name:'Tech Point',icon:'🎧',category:'Electronics',address:'Station Road, Lakhisarai, Bihar',desc:'Useful electronics and small gadgets for home, study and work.'},
{id:'s3',name:'Style Corner',icon:'👕',category:'Fashion',address:'Bazaar Road, Lakhisarai, Bihar',desc:'Everyday fashion, clothing and footwear for modern local shoppers.'},
{id:'s4',name:'Kitchen House',icon:'🍳',category:'Kitchen',address:'College Road, Lakhisarai, Bihar',desc:'Cookware, kitchen tools and practical storage products.'},
{id:'s5',name:'Glow & Care',icon:'🧴',category:'Cosmetics',address:'Main Bazaar, Lakhisarai, Bihar',desc:'Personal care and beauty essentials for daily routines.'},
{id:'s6',name:'Home & Plastic Hub',icon:'🏠',category:'Home & Plastic',address:'Purani Bazaar, Lakhisarai, Bihar',desc:'Storage, utility and durable plastic household products.'},
{id:'s7',name:'Decor Gallery',icon:'🪴',category:'Decoration',address:'Station Chowk, Lakhisarai, Bihar',desc:'Simple decorative products and lighting for home spaces.'}
];
const CATS=[
['Grocery','🛒'],['Electronics','🎧'],['Fashion','👕'],['Kitchen','🍳'],['Cosmetics','🧴'],['Home & Plastic','🏠'],['Decoration','🪴']
];

const DEFAULT_USER={name:'LKR Customer',mobile:'',wishlist:[],cart:{},orders:[],addresses:[],selectedAddress:null};
const KEY='lkr_bazaar_user_v3';
function loadUser(){try{return Object.assign({},DEFAULT_USER,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {...DEFAULT_USER}}}
let user=loadUser();
let route={screen:'home',data:{}};
let searchTerm='';
let activeCategory='All';
let shopFilter='All';
let shopProductFilter='All';
let detailImage=0;
let toastTimer;

function save(){localStorage.setItem(KEY,JSON.stringify(user))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}
function discount(p){return p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0}
function shopOf(id){return SHOPS.find(s=>s.id===id)}
function productOf(id){return PRODUCTS.find(p=>p.id===id)}
function cartEntries(){return Object.entries(user.cart).map(([id,qty])=>({p:productOf(id),qty:Number(qty)})).filter(x=>x.p&&x.qty>0)}
function cartTotal(){return cartEntries().reduce((a,x)=>a+x.p.price*x.qty,0)}
function cartCount(){return cartEntries().reduce((a,x)=>a+x.qty,0)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function imageTag(src,alt='Product'){return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22400%22 viewBox=%220 0 600 400%22%3E%3Crect width=%22600%22 height=%22400%22 fill=%22%23eef2f6%22/%3E%3Ctext x=%22300%22 y=%22210%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2224%22 fill=%22%23687386%22%3EImage unavailable%3C/text%3E%3C/svg%3E'">`}
function productCard(p){
 const w=user.wishlist.includes(p.id), d=discount(p);
 return `<article class="card">
  <div class="pimg" onclick="go('product',{id:'${p.id}'})">${imageTag(p.images[0],p.name)}<button class="wish ${w?'on':''}" onclick="event.stopPropagation();toggleWish('${p.id}')">${w?'♥':'♡'}</button></div>
  <div class="pbody">
   <div class="pname">${esc(p.name)}</div><div class="shopline">${esc(shopOf(p.shop)?.name||'Shop')}</div>
   <div><span class="price">${money(p.price)}</span>${p.mrp>p.price?`<span class="old">${money(p.mrp)}</span><span class="discount">${d}% off</span>`:''}</div>
   <div class="actions"><button class="btn primary" onclick="addCart('${p.id}')">Add to Cart</button><button class="btn secondary" onclick="go('product',{id:'${p.id}'})">View Detail</button></div>
  </div>
 </article>`
}
function renderProducts(list){return list.length?`<div class="products">${list.map(productCard).join('')}</div>`:`<div class="empty"><b>No products found</b>Try another category or search term.</div>`}

function home(){
 const q=searchTerm.trim().toLowerCase();
 const list=PRODUCTS.filter(p=>(!q||(`${p.name} ${p.category} ${p.sub} ${shopOf(p.shop)?.name}`.toLowerCase().includes(q))));
 return `<main>
  <section class="hero"><div><h1>Shop local. Shop smart.</h1><p>Welcome to <strong>LKR Bazaar</strong> — useful products from local shops.</p></div><div style="font-size:46px">🛍️</div></section>
  <section class="section" style="margin-top:16px"><div class="sectionhead"><h2>Categories</h2><button class="link" onclick="go('categories')">View all</button></div><div class="catgrid">${CATS.slice(0,8).map(c=>`<button class="cat" onclick="go('category',{category:'${esc(c[0])}'})"><div class="ico">${c[1]}</div><span>${esc(c[0])}</span></button>`).join('')}</div></section>
  <section class="section"><div class="sectionhead"><h2>Featured Products</h2></div>${renderProducts(PRODUCTS.slice(0,6))}</section>
  <section class="section"><div class="sectionhead"><h2>Latest Products</h2></div>${renderProducts(PRODUCTS.slice(-6).reverse())}</section>
  <section class="section"><div class="sectionhead"><h2>${q?'Search Results':'All Products'}</h2><span style="font-size:11px;color:var(--muted)">${list.length} products</span></div>${renderProducts(list)}</section>
 </main>`
}
function categories(){
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Categories</h1></div><div class="catgrid">${CATS.map(c=>`<button class="cat" onclick="go('category',{category:'${esc(c[0])}'})"><div class="ico">${c[1]}</div><span>${esc(c[0])}</span></button>`).join('')}</div></main>`
}
function category(){
 const list=PRODUCTS.filter(p=>p.category===route.data.category);
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><div><h1>${esc(route.data.category)}</h1><small style="color:var(--muted)">${list.length} products</small></div></div>${renderProducts(list)}</main>`
}
function shops(){
 const cats=['All',...new Set(SHOPS.map(s=>s.category))];
 const list=SHOPS.filter(s=>shopFilter==='All'||s.category===shopFilter);
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Shops</h1></div>
 <div class="chips" style="margin-bottom:14px">${cats.map(c=>`<button class="chip ${shopFilter===c?'active':''}" onclick="setShopFilter('${esc(c)}')">${esc(c)}</button>`).join('')}</div>
 <div class="list">${list.map(s=>`<article class="shopcard" onclick="go('shop',{id:'${s.id}'})"><div class="shoplogo">${s.icon}</div><div class="shopinfo"><h3>${esc(s.name)}</h3><p>${esc(s.address)}</p><p>${esc(s.category)} · ${esc(s.desc)}</p><span class="count">${PRODUCTS.filter(p=>p.shop===s.id).length} products</span></div><b>›</b></article>`).join('')}</div></main>`
}
function shop(){
 const s=shopOf(route.data.id);if(!s)return notFound();
 const products=PRODUCTS.filter(p=>p.shop===s.id);
 const cats=['All',...new Set(products.map(p=>p.sub))];
 const list=products.filter(p=>shopProductFilter==='All'||p.sub===shopProductFilter);
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Shop Detail</h1></div>
 <section class="shophero"><div class="shopheroTop"><div class="shoplogo">${s.icon}</div><div><h1>${esc(s.name)}</h1><p>${esc(s.address)}</p><p>${esc(s.category)} · ${esc(s.desc)}</p></div></div><div style="margin-top:11px;font-size:12px;color:var(--blue);font-weight:800">${products.length} total products</div></section>
 <section class="section" style="margin-top:15px"><div class="sectionhead"><h2>Shop Categories</h2></div><div class="chips">${cats.map(c=>`<button class="chip ${shopProductFilter===c?'active':''}" onclick="setShopProductFilter('${esc(c)}')">${esc(c)}</button>`).join('')}</div></section>
 <section class="section"><div class="sectionhead"><h2>Products</h2></div>${renderProducts(list)}</section></main>`
}
function product(){
 const p=productOf(route.data.id);if(!p)return notFound();const s=shopOf(p.shop),d=discount(p),w=user.wishlist.includes(p.id),qty=Number(user.cart[p.id]||0);
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Product Detail</h1></div>
 <section class="detailHero"><div class="detailMain">${imageTag(p.images[detailImage]||p.images[0],p.name)}</div><div class="thumbs">${p.images.map((im,i)=>`<button class="thumb ${i===detailImage?'active':''}" onclick="detailImage=${i};render()">${imageTag(im,p.name+' photo')}</button>`).join('')}</div></section>
 <section class="detailbox"><div style="display:flex;justify-content:space-between;gap:10px"><h1>${esc(p.name)}</h1><button class="wish ${w?'on':''}" onclick="toggleWish('${p.id}')">${w?'♥':'♡'}</button></div>
 <div><span class="price" style="font-size:22px">${money(p.price)}</span>${p.mrp>p.price?` <span class="old">${money(p.mrp)}</span> <span class="discount">${d}% off</span>`:''}</div>
 <p class="desc">${esc(p.desc)}</p>
 <div class="meta"><div>Category<strong>${esc(p.category)} · ${esc(p.sub)}</strong></div><div>Available Stock<strong>${p.stock}</strong></div></div>
 <div style="margin-top:13px;font-size:12px;color:var(--muted)">Sold by</div><button class="link" style="padding:5px 0;font-size:14px" onclick="go('shop',{id:'${p.shop}'})">${esc(s?.name||'Shop')}</button>
 </section>
 <section class="detailbox"><div style="display:flex;justify-content:space-between;align-items:center"><b>Quantity</b><div class="qty">${qty>0?`<button onclick="changeQty('${p.id}',-1)">−</button>`:''}<strong>${qty}</strong><button onclick="changeQty('${p.id}',1)">+</button></div></div>
 <div class="purchase"><button class="btn primary" ${qty<=0?'disabled':''} onclick="addCart('${p.id}',false)">Add to Cart</button>${p.price>=100?`<button class="btn orange" ${qty<=0?'disabled':''} onclick="buyNow('${p.id}')">Buy Now</button>`:''}</div>
 <p style="font-size:10px;color:var(--muted);margin:9px 0 0">Buy Now is available only for products priced ₹100 or above.</p>
 </section></main>`
}
function cart(){
 const entries=cartEntries(),total=cartTotal();
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Cart</h1></div>
 ${entries.length?`<div class="list">${entries.map(x=>`<article class="cartitem"><div class="cartimg" onclick="go('product',{id:'${x.p.id}'})">${imageTag(x.p.images[0],x.p.name)}</div><div class="cartbody"><h3 onclick="go('product',{id:'${x.p.id}'})">${esc(x.p.name)}</h3><div class="price">${money(x.p.price)}</div><div class="cartbottom"><div class="qty">${x.qty>0?`<button onclick="changeQty('${x.p.id}',-1)">−</button>`:''}<strong>${x.qty}</strong><button onclick="changeQty('${x.p.id}',1)">+</button></div><b>${money(x.p.price*x.qty)}</b><button class="btn danger" onclick="removeCart('${x.p.id}')">Remove</button></div></div></article>`).join('')}</div>
 <div class="summary"><div class="row"><span>Total products</span><b>${cartCount()}</b></div><div class="row"><span>Cart total</span><b>${money(total)}</b></div><div class="row grand"><span>Grand Total</span><b>${money(total)}</b></div><button class="btn orange full" style="margin-top:10px" onclick="checkout()">Checkout</button></div>`:
 `<div class="empty"><div style="font-size:42px">🛒</div><b>Your cart is empty</b><span>Add products to start shopping.</span><button class="btn primary" style="margin-top:15px" onclick="go('home')">Continue Shopping</button></div>`}
 </main>`
}
function profile(){
 const initials=(user.name||'L').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
 return `<main><section class="profileHero"><div class="avatar">${esc(initials||'L')}</div><div><h2>${esc(user.name||'LKR Customer')}</h2><p>${esc(user.mobile||'Mobile number not added')}</p></div></section>
 <div class="menu">
 ${menu('👤','Edit Profile','Update your name and mobile','profile-edit')}
 ${menu('📦','My Orders',`${user.orders.length} saved order(s)`,'orders')}
 ${menu('♥','Wishlist / Favorites',`${user.wishlist.length} saved product(s)`,'wishlist')}
 ${menu('📍','Delivery Addresses',`${user.addresses.length} saved address(es)`,'addresses')}
 ${menu('🔔','Notifications','View all notifications','notifications')}
 ${menu('🚪','Logout','Return to account screen','logout')}
 </div></main>`
}
function menu(i,t,s,a){return `<button class="menuitem" onclick="profileAction('${a}')"><span class="menuico">${i}</span><span><strong>${t}</strong><small>${s}</small></span><span class="arrow">›</span></button>`}
function profileEdit(){
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Edit Profile</h1></div><form class="form" onsubmit="saveProfile(event)"><div class="field"><label>Full Name</label><input id="editName" required value="${esc(user.name)}"></div><div class="field"><label>Mobile Number</label><input id="editMobile" inputmode="tel" value="${esc(user.mobile)}"></div><button class="btn primary full">Save Changes</button></form></main>`
}
function orders(){
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>My Orders</h1></div>${user.orders.length?`<div>${user.orders.map(o=>`<article class="order"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(o.id)}</h3><span class="status">${esc(o.status)}</span></div><p>${esc(o.date)} · ${esc(o.time)}</p><div class="orderproducts">${o.items.map(i=>`<div class="row"><span>${esc(i.name)} × ${i.qty}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}</div><div class="row grand"><span>Total</span><b>${money(o.total)}</b></div><p>Delivery: ${esc(o.address||'No address selected')}</p></article>`).join('')}</div>`:`<div class="empty"><b>No Orders Yet</b>Your completed orders will appear here.</div>`}</main>`
}
function wishlist(){
 const list=user.wishlist.map(productOf).filter(Boolean);
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Wishlist / Favorites</h1></div>${renderProducts(list)}</main>`
}
function addresses(){
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Delivery Addresses</h1></div><button class="btn primary full" style="margin-bottom:11px" onclick="addressForm()">＋ Add Address</button>${user.addresses.length?user.addresses.map(a=>`<article class="address ${user.selectedAddress===a.id?'selected':''}"><h3>${esc(a.name)} ${user.selectedAddress===a.id?'· Selected':''}</h3><p>${esc(a.line1)}<br>${esc(a.city)}, ${esc(a.state)} - ${esc(a.pin)}<br>Mobile: ${esc(a.mobile)}</p><div class="actions"><button class="btn secondary" onclick="selectAddress('${a.id}')">${user.selectedAddress===a.id?'Selected':'Use this'}</button><button class="btn secondary" onclick="addressForm('${a.id}')">Edit</button><button class="btn danger" onclick="deleteAddress('${a.id}')">Delete</button></div></article>`).join(''):`<div class="empty"><b>No saved addresses</b>Add an address for faster checkout.</div>`}</main>`
}
function notifications(){
 const ns=[['Order updates','Your LKR Bazaar order status will appear here.'],['New products','New local products have been added to the demo catalogue.'],['Offers','Check product cards for current demo discounts.']];
 return `<main><div class="pagehead"><button class="back" onclick="back()">‹</button><h1>Notifications</h1></div>${ns.map(n=>`<article class="notice"><strong>🔔 ${n[0]}</strong><p>${n[1]}</p></article>`).join('')}</main>`
}
function login(){
 return `<main style="padding-top:40px"><div class="hero"><div><h1>Welcome to LKR Bazaar</h1><p>Sign in to continue shopping locally.</p></div><div style="font-size:45px">🛍️</div></div><form class="form" style="margin-top:14px" onsubmit="loginSubmit(event)"><div class="field"><label>Full Name</label><input id="loginName" required placeholder="Your full name" value="${esc(user.name==='LKR Customer'?'':user.name)}"></div><div class="field"><label>Mobile Number</label><input id="loginMobile" inputmode="tel" placeholder="Mobile number" value="${esc(user.mobile)}"></div><button class="btn primary full">Enter LKR Bazaar</button></form></main>`
}
function notFound(){return `<main><div class="empty"><b>Page not found</b><button class="btn primary" onclick="go('home')">Go Home</button></div></main>`}

function appPage(){
 if(route.screen==='login')return login();
 let content=route.screen==='home'?home():route.screen==='categories'?categories():route.screen==='category'?category():route.screen==='shops'?shops():route.screen==='shop'?shop():route.screen==='product'?product():route.screen==='cart'?cart():route.screen==='profile'?profile():route.screen==='profile-edit'?profileEdit():route.screen==='orders'?orders():route.screen==='wishlist'?wishlist():route.screen==='addresses'?addresses():route.screen==='notifications'?notifications():notFound();
 const active=['home','categories','shops','cart','profile'].includes(route.screen)?route.screen:(route.screen==='category'?'categories':(route.screen==='shop'?'shops':(route.screen==='product'?(route.data.from||'home'):(['orders','wishlist','addresses','notifications','profile-edit'].includes(route.screen)?'profile':route.screen))));
 return `<div class="shell"><header class="top"><div class="brandrow"><div class="brand">LKR Bazaar<small>LOCAL SHOPPING, MADE SIMPLE</small></div><button class="iconbtn" onclick="go('notifications')">🔔<span class="badge">${user.orders.length?'1':'3'}</span></button></div><div class="searchrow"><div class="search">🔎<input id="searchInput" value="${esc(searchTerm)}" oninput="onSearch(this.value)" placeholder="Search products, shops or categories"></div></div></header>${content}<nav class="bottom">${nav('home','⌂','Home',active)}${nav('categories','▦','Categories',active)}${nav('shops','▣','Shops',active)}${nav('cart','🛒','Cart',active,cartCount())}${nav('profile','◉','Profile',active)}</nav></div>`
}
function nav(s,ico,label,active,badge=0){return `<button class="nav ${active===s?'active':''}" onclick="go('${s}')"><span>${ico}${badge?`<sup style="background:var(--orange);color:#fff;border-radius:99px;padding:1px 4px;font-size:8px">${badge}</sup>`:''}</span>${label}</button>`}

function render(){document.getElementById('app').innerHTML=appPage();window.scrollTo(0,0)}
function go(screen,data={},replace=false){
 const prev=route.screen;
 route={screen,data};
 if(screen==='product'&&prev!=='product')detailImage=0;
 if(screen==='shop'&&prev!=='shop')shopProductFilter='All';
 if(screen!=='shop'&&prev!=='shop'){}
 const state={route,searchTerm,shopFilter,shopProductFilter};
 if(replace)history.replaceState(state,'');else history.pushState(state,'');
 render();
}
function back(){if(history.length>1)history.back();else go('home',{},true)}
window.addEventListener('popstate',e=>{
 const s=e.state;
 if(s&&s.route){route=s.route;searchTerm=s.searchTerm||'';shopFilter=s.shopFilter||'All';shopProductFilter=s.shopProductFilter||'All';render()}
 else {route={screen:'home',data:{}};render()}
});
function setShopFilter(v){shopFilter=v;go('shops',{},true)}
function setShopProductFilter(v){shopProductFilter=v;go('shop',route.data,true)}
function onSearch(v){searchTerm=v;render()}
function addCart(id,show=true){
 const p=productOf(id);if(!p)return;
 const next=Math.min(Number(user.cart[id]||0)+1,p.stock);user.cart[id]=next;save();render();if(show)toast(`${p.name} added to cart`);
}
function changeQty(id,d){
 const p=productOf(id);if(!p)return;
 const next=Math.max(0,Math.min(p.stock,Number(user.cart[id]||0)+d));
 if(next===0)delete user.cart[id];else user.cart[id]=next;save();render();
}
function removeCart(id){delete user.cart[id];save();render();toast('Product removed from cart')}
function toggleWish(id){const i=user.wishlist.indexOf(id);if(i>=0){user.wishlist.splice(i,1);toast('Removed from wishlist')}else{user.wishlist.push(id);toast('Added to wishlist')}save();render()}
function buyNow(id){
 const p=productOf(id);if(!p||p.price<100){toast('Buy Now is available only for products priced ₹100 or above.');return}
 if(!Number(user.cart[id])){user.cart[id]=1;save()}
 checkout()
}
function checkout(){
 const total=cartTotal();if(total<100){toast('Order करने के लिए कम से कम ₹100 की खरीदारी करें।');return}
 if(!user.addresses.length){toast('Please add a delivery address first.');go('addresses');return}
 if(!user.selectedAddress)user.selectedAddress=user.addresses[0].id;
 const a=user.addresses.find(x=>x.id===user.selectedAddress);
 document.getElementById('modalContent').innerHTML=`<div class="sheethead"><h2 style="margin:0">Confirm Order</h2><button class="close" onclick="closeModal()">✕</button></div><div class="summary" style="margin-top:14px"><div class="row"><span>Products</span><b>${cartCount()}</b></div><div class="row grand"><span>Total</span><b>${money(total)}</b></div></div><div class="address" style="margin-top:10px"><h3>Delivery Address</h3><p>${esc(a?.name||'')}<br>${esc(a?.line1||'')}, ${esc(a?.city||'')} - ${esc(a?.pin||'')}<br>Mobile: ${esc(a?.mobile||'')}</p><button class="btn secondary" onclick="closeModal();go('addresses')">Change Address</button></div><button class="btn orange full" style="margin-top:12px" onclick="placeOrder()">Place Order</button>`;
 document.getElementById('modal').classList.add('show');
}
function placeOrder(){
 const total=cartTotal();if(total<100){closeModal();toast('Order करने के लिए कम से कम ₹100 की खरीदारी करें।');return}
 if(!user.addresses.length){closeModal();go('addresses');return}
 const now=new Date(),items=cartEntries().map(x=>({id:x.p.id,name:x.p.name,qty:x.qty,price:x.p.price}));
 const o={id:'LKR-'+Date.now().toString().slice(-8),date:now.toLocaleDateString('en-IN'),time:now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),items,total,address:(()=>{const a=user.addresses.find(x=>x.id===user.selectedAddress)||user.addresses[0];return `${a.name}, ${a.line1}, ${a.city}, ${a.state} - ${a.pin}`})(),status:'Order Placed'};
 user.orders.unshift(o);user.cart={};save();closeModal();toast('Order placed successfully');go('orders');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function profileAction(a){
 if(a==='logout'){logout();return}
 go(a)
}
function saveProfile(e){e.preventDefault();user.name=document.getElementById('editName').value.trim()||'LKR Customer';user.mobile=document.getElementById('editMobile').value.trim();save();toast('Profile updated');go('profile')}
function loginSubmit(e){e.preventDefault();user.name=document.getElementById('loginName').value.trim()||'LKR Customer';user.mobile=document.getElementById('loginMobile').value.trim();save();go('home',{},true);toast('Welcome to LKR Bazaar')}
function logout(){localStorage.removeItem(KEY);user={...DEFAULT_USER};history.replaceState({route:{screen:'login',data:{}},searchTerm:'',shopFilter:'All',shopProductFilter:'All'},'');route={screen:'login',data:{}};render();toast('Logged out')}
function addressForm(id){
 const a=id?user.addresses.find(x=>x.id===id):null;
 document.getElementById('modalContent').innerHTML=`<div class="sheethead"><h2 style="margin:0">${a?'Edit Address':'Add Address'}</h2><button class="close" onclick="closeModal()">✕</button></div><form class="form" style="border:0;padding:12px 0 0" onsubmit="saveAddress(event,'${id||''}')">
 <div class="field"><label>Name</label><input id="aName" required value="${esc(a?.name||user.name)}"></div>
 <div class="field"><label>Address</label><textarea id="aLine" required>${esc(a?.line1||'')}</textarea></div>
 <div class="field"><label>City</label><input id="aCity" required value="${esc(a?.city||'')}"></div>
 <div class="field"><label>State</label><input id="aState" required value="${esc(a?.state||'Bihar')}"></div>
 <div class="field"><label>PIN Code</label><input id="aPin" required inputmode="numeric" value="${esc(a?.pin||'')}"></div>
 <div class="field"><label>Mobile</label><input id="aMobile" required inputmode="tel" value="${esc(a?.mobile||user.mobile)}"></div>
 <button class="btn primary full">Save Address</button></form>`;
 document.getElementById('modal').classList.add('show');
}
function saveAddress(e,id){e.preventDefault();const obj={id:id||'a'+Date.now(),name:document.getElementById('aName').value.trim(),line1:document.getElementById('aLine').value.trim(),city:document.getElementById('aCity').value.trim(),state:document.getElementById('aState').value.trim(),pin:document.getElementById('aPin').value.trim(),mobile:document.getElementById('aMobile').value.trim()};const idx=user.addresses.findIndex(x=>x.id===obj.id);if(idx>=0)user.addresses[idx]=obj;else user.addresses.push(obj);if(!user.selectedAddress)user.selectedAddress=obj.id;save();closeModal();render();toast('Address saved')}
function selectAddress(id){user.selectedAddress=id;save();render();toast('Delivery address selected')}
function deleteAddress(id){if(!confirm('Delete this address?'))return;user.addresses=user.addresses.filter(x=>x.id!==id);if(user.selectedAddress===id)user.selectedAddress=user.addresses[0]?.id||null;save();render();toast('Address deleted')}

document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

if(user.name==='LKR Customer'&&!user.mobile){route={screen:'login',data:{}};history.replaceState({route,searchTerm,shopFilter,shopProductFilter},'')}
else {route={screen:'home',data:{}};history.replaceState({route,searchTerm,shopFilter,shopProductFilter},'')}
render();
</script>
</body>
</html>
